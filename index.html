<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Órbita · Quiz espacial</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #fff;
      --surface-soft: #f0f3f9;
      --text: #19243a;
      --muted: #69758c;
      --line: #e3e8f1;
      --accent: #635bff;
      --accent-soft: #eeedff;
      --correct: #16834b;
      --correct-bg: #e5f8ed;
      --incorrect: #d43d4f;
      --incorrect-bg: #fff0f1;
      --shadow: 0 18px 55px rgb(35 49 84 / 9%);
      --console-bg: #eaf0fa;
      --console-text: #19243a;
      --console-muted: #65738d;
      --console-line: #d3dceb;
      --console-panel: #f8faff;
      --console-accent: #554ce0;
      --console-grid: rgb(69 91 139 / 6%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10131d;
        --surface: #191e2b;
        --surface-soft: #222939;
        --text: #edf0fa;
        --muted: #a1abc0;
        --line: #30394c;
        --accent: #a49cff;
        --accent-soft: #2a2847;
        --correct: #55d48b;
        --correct-bg: #173b2b;
        --incorrect: #ff7884;
        --incorrect-bg: #45232c;
        --shadow: 0 18px 55px rgb(0 0 0 / 22%);
        --console-bg: #151c2b;
        --console-text: #eff3ff;
        --console-muted: #a0aec7;
        --console-line: #313c51;
        --console-panel: #1d2638;
        --console-accent: #aaa2ff;
        --console-grid: rgb(167 179 218 / 6%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(99 91 255 / 9%), transparent 42%),
        var(--page);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 470px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 22px;
      border-bottom: 1px solid var(--console-line);
      background:
        linear-gradient(var(--console-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--console-grid) 1px, transparent 1px),
        radial-gradient(ellipse at 15% 0%, color-mix(in srgb, var(--console-accent) 12%, transparent), transparent 65%),
        var(--console-bg);
      background-size: 22px 22px, 22px 22px, auto, auto;
      color: var(--console-text);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 11px;
    }

    .brand-icon {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--console-line);
      border-radius: 13px;
      background: var(--console-panel);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 28%);
      font-size: 21px;
    }

    .brand-copy { min-width: 0; }

    .brand-kicker, .score-label {
      display: block;
      color: var(--console-muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
      line-height: 1.35;
    }

    .brand-title {
      display: block;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.4;
    }

    .brand-subtitle {
      color: var(--console-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      vertical-align: 1px;
    }

    .mission-readout {
      display: grid;
      flex: 0 0 auto;
      justify-items: end;
      gap: 4px;
    }

    .mission-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--correct);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;
      line-height: 1.3;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 17%, transparent), 0 0 9px color-mix(in srgb, currentColor 55%, transparent);
    }

    .score-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border: 1px solid var(--console-line);
      border-radius: 9px;
      background: var(--console-panel);
      color: var(--console-muted);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .score-pill strong { color: var(--console-accent); font-size: 16px; line-height: 1; }
    .score-divider { color: var(--console-line); }

    main { padding: 25px 26px 27px; }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #766dff, #a35cf4);
      transition: width 400ms cubic-bezier(.2,.8,.2,1);
    }

    .eyebrow {
      margin: 30px 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(21px, 5vw, 25px);
      line-height: 1.28;
      letter-spacing: -.035em;
    }

    .hint {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      min-height: 51px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms, background 160ms, transform 160ms;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer:focus-visible, .next:focus-visible, .restart:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      flex: 0 0 27px;
      height: 27px;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--text);
      animation: pop-in 350ms ease both;
    }

    .answer.correct .answer-letter { background: var(--correct); color: #fff; }
    .answer.incorrect {
      border-color: var(--incorrect);
      background: var(--incorrect-bg);
      animation: shake 380ms ease both;
    }

    .answer.incorrect .answer-letter { background: var(--incorrect); color: #fff; }

    .feedback {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      animation: rise-in 260ms ease both;
    }

    .feedback.show { display: block; }
    .feedback.good { background: var(--correct-bg); color: var(--correct); }
    .feedback.bad { background: var(--incorrect-bg); color: var(--incorrect); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 19px;
    }

    .next, .restart {
      display: inline-flex;
      min-height: 43px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 17px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms, filter 160ms;
    }

    .next:hover, .restart:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .next:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .result {
      padding: 12px 0 3px;
      text-align: center;
      animation: rise-in 420ms ease both;
    }

    .result-emoji {
      display: grid;
      width: 94px;
      height: 94px;
      place-items: center;
      margin: 3px auto 16px;
      border-radius: 28px;
      background: var(--accent-soft);
      font-size: 52px;
      animation: float 2.2s ease-in-out infinite;
    }

    .result .eyebrow { margin: 0 0 8px; }
    .result h1 { font-size: 27px; }
    .result-copy { max-width: 320px; margin: 10px auto 18px; color: var(--muted); }

    .final-score {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 21px;
      padding: 10px 17px;
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .final-score strong { font-size: 24px; letter-spacing: -.04em; }
    .final-score span { color: var(--muted); font-size: 14px; }

    .answer-review { margin: 0 0 21px; text-align: left; }
    .answer-review h2 { margin: 0 0 10px; font-size: 16px; }
    .answer-review-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .answer-review-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
      font-size: 14px;
    }
    .answer-review-question { margin: 0 0 7px; font-weight: 700; }
    .answer-review-item p { margin: 4px 0 0; }
    .answer-review-selected { color: var(--incorrect); }
    .answer-review-correct { color: var(--correct); }
    .answer-review-fact { margin-top: 8px !important; color: var(--muted); }
    .all-correct {
      margin: 0;
      padding: 12px;
      border-radius: 12px;
      background: var(--correct-bg);
      color: var(--correct);
      font-size: 14px;
      font-weight: 650;
    }

    .result .restart { display: flex; width: 100%; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @keyframes pop-in {
      0% { transform: scale(.98); }
      65% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 420px) {
      body { padding: 18px 12px; }
      .top { padding: 15px 17px; }
      .brand { gap: 9px; }
      .brand-icon { flex-basis: 38px; width: 38px; height: 38px; }
      .brand-subtitle { display: none; }
      main { padding: 21px 19px 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top" aria-label="Panel de control de misión">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🪐</span>
        <div class="brand-copy">
          <span class="brand-kicker">CONTROL DE MISIÓN</span>
          <span class="brand-title">Órbita <span class="brand-subtitle">/ EXPLORACIÓN</span></span>
        </div>
      </div>
      <div class="mission-readout">
        <span class="mission-status"><span class="status-light" aria-hidden="true"></span>MISIÓN ACTIVA</span>
        <div class="score-pill" aria-label="Puntuación actual">
          <span class="score-label">PUNTOS</span>
          <strong id="score" aria-live="polite">0</strong>
          <span class="score-divider" aria-hidden="true">/</span>
          <span>100</span>
        </div>
      </div>
    </header>
    <main id="main">
      <div class="progress-meta">
        <span id="question-count">Pregunta 1 de 10</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <section id="quiz" aria-live="polite">
        <p class="eyebrow">Misión de exploración</p>
        <h1 id="question" tabindex="-1"></h1>
        <p class="hint">Elige la respuesta correcta para continuar.</p>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" role="status"></div>
        <div class="actions">
          <button class="next" id="next" type="button" disabled>Siguiente <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const questions = [
      {
        question: "¿Cuál fue el primer satélite artificial puesto en órbita?",
        answers: ["Explorer 1", "Sputnik 1", "Vanguard 1", "Luna 1"],
        correct: 1,
        fact: "La Unión Soviética lanzó Sputnik 1 en 1957, dando comienzo a la era espacial."
      },
      {
        question: "¿Qué planeta visitó primero una nave espacial?",
        answers: ["Marte", "Júpiter", "Venus", "Mercurio"],
        correct: 2,
        fact: "Mariner 2 sobrevoló Venus en 1962: fue la primera visita de una nave a otro planeta."
      },
      {
        question: "¿Cómo se llamó el primer ser humano en viajar al espacio?",
        answers: ["Neil Armstrong", "Yuri Gagarin", "John Glenn", "Valentina Tereshkova"],
        correct: 1,
        fact: "Yuri Gagarin orbitó la Tierra el 12 de abril de 1961 a bordo de Vostok 1."
      },
      {
        question: "¿Qué misión llevó a los primeros astronautas a la Luna?",
        answers: ["Apollo 8", "Apollo 10", "Apollo 11", "Apollo 13"],
        correct: 2,
        fact: "Apollo 11 alunizó en julio de 1969; Neil Armstrong y Buzz Aldrin caminaron sobre la Luna."
      },
      {
        question: "¿Qué sonda lleva un disco dorado con sonidos e imágenes de la Tierra?",
        answers: ["Pioneer 10", "Voyager 1 y 2", "New Horizons", "Cassini"],
        correct: 1,
        fact: "Las dos sondas Voyager llevan el Disco de Oro, un mensaje para posibles civilizaciones."
      },
      {
        question: "¿En qué planeta aterrizó el rover Perseverance en 2021?",
        answers: ["Marte", "Venus", "La Luna", "Titán"],
        correct: 0,
        fact: "Perseverance explora el cráter Jezero de Marte y busca señales de vida microbiana antigua."
      },
      {
        question: "¿Qué telescopio espacial se lanzó en 2021 para observar el universo infrarrojo?",
        answers: ["Hubble", "Kepler", "James Webb", "Chandra"],
        correct: 2,
        fact: "El telescopio James Webb observa principalmente en el infrarrojo y estudia galaxias muy lejanas."
      },
      {
        question: "¿Cuál es el propósito principal de la Estación Espacial Internacional?",
        answers: ["Probar aviones espaciales", "Servir como laboratorio en órbita", "Mapear otros planetas", "Lanzar satélites"],
        correct: 1,
        fact: "La EEI es un laboratorio habitado donde equipos internacionales hacen ciencia en microgravedad."
      },
      {
        question: "¿Qué misión de la NASA llevó con éxito a personas alrededor de la Luna en 2022?",
        answers: ["Artemis I", "Artemis II", "Gemini 4", "Apollo 17"],
        correct: 0,
        fact: "Artemis I probó sin tripulación el cohete SLS y la nave Orion en un viaje alrededor de la Luna."
      },
      {
        question: "¿Qué cuerpo celeste estudió de cerca la misión Rosetta?",
        answers: ["Un asteroide", "Un cometa", "Marte", "Europa, luna de Júpiter"],
        correct: 1,
        fact: "Rosetta acompañó al cometa 67P y su módulo Philae logró posarse en su superficie."
      }
    ];

    let current = 0;
    let score = 0;
    let answered = false;
    const responses = [];

    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const feedbackEl = document.getElementById("feedback");
    const nextButton = document.getElementById("next");
    const progressFill = document.getElementById("progress-fill");
    const progressTrack = document.querySelector(".progress-track");

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      document.getElementById("question-count").textContent = `Pregunta ${current + 1} de ${questions.length}`;
      document.getElementById("progress-percent").textContent = `${Math.round((current / questions.length) * 100)}%`;
      progressFill.style.width = `${(current / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", String(current));
      questionEl.textContent = item.question;
      feedbackEl.className = "feedback";
      feedbackEl.textContent = "";
      nextButton.disabled = true;
      nextButton.innerHTML = current === questions.length - 1
        ? 'Ver resultados <span aria-hidden="true">→</span>'
        : 'Siguiente <span aria-hidden="true">→</span>';
      answersEl.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        answersEl.append(button);
      });
    }

    function selectAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      responses[current] = selected;
      const correct = selected === item.correct;
      const buttons = [...answersEl.children];
      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.correct) button.classList.add("correct");
        if (index === selected && !correct) button.classList.add("incorrect");
      });

      if (correct) {
        score += 10;
        document.getElementById("score").textContent = String(score);
        feedbackEl.className = "feedback show good";
        feedbackEl.textContent = `¡Correcto! ${item.fact}`;
      } else {
        feedbackEl.className = "feedback show bad";
        feedbackEl.textContent = `¡Casi! ${item.fact}`;
      }

      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      document.getElementById("progress-percent").textContent = `${Math.round(((current + 1) / questions.length) * 100)}%`;
      progressTrack.setAttribute("aria-valuenow", String(current + 1));
      nextButton.disabled = false;
      nextButton.focus();
    }

    function showResults() {
      const percent = (score / (questions.length * 10)) * 100;
      let emoji = "🚀";
      let heading = "¡Misión completada!";
      let message = "Cada gran exploración comienza con una pregunta. ¡Sigue descubriendo el universo!";
      if (percent === 100) {
        emoji = "🏆";
        heading = "¡Explorador estelar!";
        message = "¡Diez de diez! Tu conocimiento espacial está fuera de este mundo.";
      } else if (percent >= 70) {
        emoji = "🛰️";
        heading = "¡Gran viaje!";
        message = "Tienes una órbita excelente. Ya sabes un montón sobre exploración espacial.";
      } else if (percent < 40) {
        emoji = "🌱";
        heading = "¡A despegar!";
        message = "Todo explorador empieza en algún lugar. ¡Prueba otra vez y descubre algo nuevo!";
      }

      document.getElementById("progress-percent").textContent = "100%";
      progressFill.style.width = "100%";
      progressTrack.setAttribute("aria-valuenow", String(questions.length));
      document.getElementById("question-count").textContent = "Misión finalizada";
      document.getElementById("quiz").innerHTML = `
        <section class="result" aria-live="polite">
          <div class="result-emoji" aria-hidden="true">${emoji}</div>
          <p class="eyebrow">Fin de la misión</p>
          <h1>${heading}</h1>
          <p class="result-copy">${message}</p>
          <div class="final-score"><strong>${score}</strong><span>de 100 puntos</span></div>
          <button class="restart" id="restart" type="button">↻ &nbsp;Jugar de nuevo</button>
        </section>`;
      const review = document.createElement("section");
      review.className = "answer-review";
      review.setAttribute("aria-labelledby", "answer-review-title");
      const reviewTitle = document.createElement("h2");
      reviewTitle.id = "answer-review-title";
      reviewTitle.textContent = "Respuestas para revisar";
      review.append(reviewTitle);

      const missed = questions
        .map((item, index) => ({ item, response: responses[index] }))
        .filter(({ item, response }) => response !== item.correct);
      if (missed.length === 0) {
        const allCorrect = document.createElement("p");
        allCorrect.className = "all-correct";
        allCorrect.textContent = "¡Todas tus respuestas fueron correctas!";
        review.append(allCorrect);
      } else {
        const reviewList = document.createElement("ol");
        reviewList.className = "answer-review-list";
        missed.forEach(({ item, response }) => {
          const reviewItem = document.createElement("li");
          reviewItem.className = "answer-review-item";
          const question = document.createElement("p");
          question.className = "answer-review-question";
          question.textContent = item.question;
          const selectedAnswer = document.createElement("p");
          selectedAnswer.className = "answer-review-selected";
          selectedAnswer.textContent = `Tu respuesta: ${item.answers[response]}`;
          const correctAnswer = document.createElement("p");
          correctAnswer.className = "answer-review-correct";
          correctAnswer.textContent = `Respuesta correcta: ${item.answers[item.correct]}`;
          const fact = document.createElement("p");
          fact.className = "answer-review-fact";
          fact.textContent = item.fact;
          reviewItem.append(question, selectedAnswer, correctAnswer, fact);
          reviewList.append(reviewItem);
        });
        review.append(reviewList);
      }
      document.querySelector(".result").insertBefore(review, document.getElementById("restart"));
      document.getElementById("restart").addEventListener("click", restartQuiz);
      document.getElementById("restart").focus();
    }

    function restartQuiz() {
      location.reload();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (current === questions.length - 1) {
        showResults();
      } else {
        current += 1;
        renderQuestion();
        questionEl.focus({ preventScroll: true });
      }
    });

    renderQuestion();
  </script>
</body>
</html>
